spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  source:
    storage-root: ${java.io.tmpdir}/funchole-source-tests

management:
  endpoints:
    web:
      exposure:
        include: flyway

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
