plugins {
    id 'application'
}

description = 'Standalone invocation dispatcher service.'

dependencies {
    implementation project(':invocation')
    implementation project(':runtime-registry')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.zaxxer:HikariCP'
    implementation "io.nats:jnats:${natsVersion}"
    implementation 'org.postgresql:postgresql'
    implementation 'org.slf4j:slf4j-simple'

    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.funchole.backend.dispatcher.DispatcherMain'
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles an executable fat jar for the dispatcher service.'
    archiveFileName = 'funchole-dispatcher.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
