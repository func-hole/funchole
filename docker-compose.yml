services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: funchole-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/funchole
      DB_USERNAME: funchole
      DB_PASSWORD: funchole
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  db:
    image: postgres:17.6
    container_name: funchole-postgres
    environment:
      POSTGRES_DB: funchole
      POSTGRES_USER: funchole
      POSTGRES_PASSWORD: funchole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funchole -d funchole"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
