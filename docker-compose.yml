services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/funchole
      DB_USERNAME: funchole
      DB_PASSWORD: funchole
      SERVER_PORT: 7080
    ports:
      - "7080:7080"
    networks:
      - funchole-network

  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: funchole
      POSTGRES_USER: funchole
      POSTGRES_PASSWORD: funchole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funchole -d funchole"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - funchole-network

volumes:
  postgres-data:

networks:
  funchole-network:
    driver: bridge
