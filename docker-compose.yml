services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
      target: controlplane
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/root-token
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "7080:7080"
    volumes:
      - openbao-data:/openbao:ro
    networks:
      - funchole-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/root-token
      NATS_URL: nats://nats:4222
    ports:
      - "443:443"
    volumes:
      - openbao-data:/openbao:ro
    networks:
      - funchole-network

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: dispatcher
    depends_on:
      db:
        condition: service_healthy
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      DB_URL: jdbc:postgresql://db:5432/funchole
      DB_USERNAME: funchole
      DB_PASSWORD: funchole
    networks:
      - funchole-network

  nats:
    image: nats:2.14.6-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - funchole-network

  openbao:
    image: docker.io/openbao/openbao:2.6.1
    cap_add:
      - IPC_LOCK
    command: ["server", "-config=/etc/openbao/local.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8200:8200"
    volumes:
      - openbao-data:/openbao
      - ./docker/openbao/local.hcl:/etc/openbao/local.hcl:ro
    networks:
      - funchole-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CONTROLPLANE_URL: http://localhost:7080
    ports:
      - "3000:3000"
    networks:
      - funchole-network

  openbao-init:
    image: curlimages/curl:8.15.0
    depends_on:
      openbao:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_STATE_DIR: /openbao/bootstrap
    volumes:
      - ./docker/openbao-init/init-openbao.sh:/init-openbao.sh:ro
      - ./docker/openbao-init/secrets:/secrets:ro
      - openbao-data:/openbao
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    networks:
      - funchole-network

  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: funchole
      POSTGRES_USER: funchole
      POSTGRES_PASSWORD: funchole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funchole -d funchole"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - funchole-network

volumes:
  postgres-data:
  openbao-data:
  nats-data:

networks:
  funchole-network:
    driver: bridge
