services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-controlplane
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      dns:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/root-token
      DNS_SERVICE_NAME: dns
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "7080:7080"
    volumes:
      - .:/workspace
      - openbao-dev-data:/openbao:ro
    entrypoint: ["sh", "/workspace/docker/controlplane-dev-entrypoint.sh"]
    networks:
      - funchole-dev-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-gateway
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /openbao/bootstrap/root-token
      NATS_URL: nats://nats:4222
    ports:
      - "443:443"
    volumes:
      - .:/workspace
      - openbao-dev-data:/openbao:ro
    entrypoint: ["sh", "/workspace/docker/gateway-dev-entrypoint.sh"]
    networks:
      - funchole-dev-network

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-dispatcher
    depends_on:
      db:
        condition: service_healthy
      controlplane:
        condition: service_healthy
      nats:
        condition: service_started
      runtime:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      DB_URL: jdbc:postgresql://db:5432/funchole
      DB_USERNAME: funchole
      DB_PASSWORD: funchole
      DEV_RUNTIME_INSTANCE_ID: runtime-node-dev-1
      DEV_RUNTIME_TYPE: NODE
      DEV_RUNTIME_SOCKET_PATH: /tmp/funchole/runtime-node-dev-1.sock
    volumes:
      - .:/workspace
      - runtime-sockets:/tmp/funchole
    entrypoint: ["sh", "/workspace/docker/dispatcher-dev-entrypoint.sh"]
    networks:
      - funchole-dev-network

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-runtime
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUNTIME_INSTANCE_ID: runtime-node-dev-1
      RUNTIME_TYPE: NODE
      RUNTIME_WORKER_SOCKET_PATH: /tmp/funchole/runtime-node-dev-1.sock
      ARTIFACT_STORE_TYPE: s3
      ARTIFACT_CACHE_DIR: /tmp/funchole/artifact-cache
      S3_ARTIFACT_ENDPOINT: http://rustfs:9000
      S3_ARTIFACT_BUCKET: funchole-artifacts
      S3_ARTIFACT_ACCESS_KEY: funchole
      S3_ARTIFACT_SECRET_KEY: funchole-secret
      S3_ARTIFACT_REGION: us-east-1
      S3_ARTIFACT_PATH_STYLE_ACCESS: "true"
    volumes:
      - .:/workspace
      - runtime-sockets:/tmp/funchole
    entrypoint: ["sh", "/workspace/docker/runtime-dev-entrypoint.sh"]
    networks:
      - funchole-dev-network

  nats:
    image: nats:2.14.6-alpine
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-dev-data:/data
    networks:
      - funchole-dev-network

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: funchole
      RUSTFS_SECRET_KEY: funchole-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-dev-data:/data
    networks:
      - funchole-dev-network

  rustfs-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: funchole
      AWS_SECRET_ACCESS_KEY: funchole-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./runtime/artifacts/dev:/artifacts/dev:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "Waiting for RustFS..."
          sleep 1
        done

        aws --endpoint-url http://rustfs:9000 s3 mb s3://funchole-artifacts >/dev/null 2>&1 || true

        for artifact_dir in /artifacts/dev/*; do
          if [ ! -d "$$artifact_dir" ]; then
            continue
          fi

          component_version_id="$$(basename "$$artifact_dir")"
          archive="/tmp/$$component_version_id.tar.gz"
          object_key="s3://funchole-artifacts/artifacts/$$component_version_id/artifact.tar.gz"

          tar -C "$$artifact_dir" -czf "$$archive" .
          aws --endpoint-url http://rustfs:9000 s3 cp "$$archive" "$$object_key"
        done
    networks:
      - funchole-dev-network

  openbao:
    image: docker.io/openbao/openbao:2.6.1
    cap_add:
      - IPC_LOCK
    command: ["server", "-config=/etc/openbao/local.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_API_ADDR: http://openbao:8200
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8200:8200"
    volumes:
      - openbao-dev-data:/openbao
      - ./docker/openbao/local.hcl:/etc/openbao/local.hcl:ro
    networks:
      - funchole-dev-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-web
    depends_on:
      controlplane:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_CONTROLPLANE_URL: http://localhost:7080
    ports:
      - "3000:3000"
    volumes:
      - ./control-plane-web:/workspace/web
      - web-node-modules:/workspace/web/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    networks:
      - funchole-dev-network

  openbao-init:
    image: curlimages/curl:8.15.0
    depends_on:
      openbao:
        condition: service_started
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_STATE_DIR: /openbao/bootstrap
    volumes:
      - ./docker/openbao-init/init-openbao.sh:/init-openbao.sh:ro
      - ./docker/openbao-init/secrets:/secrets:ro
      - openbao-dev-data:/openbao
    entrypoint: ["/bin/sh", "/init-openbao.sh"]
    networks:
      - funchole-dev-network

  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: funchole
      POSTGRES_USER: funchole
      POSTGRES_PASSWORD: funchole
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funchole -d funchole"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - funchole-dev-network

  dns:
    image: technitium/dns-server:latest
    environment:
      DNS_SERVER_DOMAIN: dns.funchole.local
      DNS_SERVER_ADMIN_PASSWORD: admin
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "5380:5380/tcp"
    volumes:
      - technitium-dev-data:/etc/dns
    networks:
      - funchole-dev-network

volumes:
  postgres-dev-data:
  openbao-dev-data:
  technitium-dev-data:
  web-node-modules:
  nats-dev-data:
  runtime-sockets:
  rustfs-dev-data:

networks:
  funchole-dev-network:
    driver: bridge
