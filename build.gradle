plugins {
    id 'java'
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.funchole'
version = '0.1.0-SNAPSHOT'

ext {
    springBootVersion = '4.1.1'
    testcontainersVersion = '2.0.5'
    mapstructVersion = '1.6.3'
    springdocVersion = '3.0.3'
    jwtVersion = '0.13.0'
    dnsjavaVersion = '3.6.5'
    bouncyCastleVersion = '1.81'
    natsVersion = '2.26.0'
    awsSdkVersion = '2.29.52'
    commonsCompressVersion = '1.27.1'
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'

    // Each dev-compose service bind-mounts the same host workspace and runs
    // its own independent Gradle process with its own --project-cache-dir,
    // but by default all of them still write shared modules' compiled
    // output (e.g. :core, :certificate) into the SAME in-tree build/
    // directory. Two containers compiling the same module at once can then
    // race and corrupt each other's generated sources. When
    // FUNCHOLE_BUILD_DIR_ROOT is set (only in the dev containers - see
    // docker/*-dev-entrypoint.sh), redirect this subproject's build output
    // to a container-local path outside the shared bind mount instead.
    String isolatedBuildRoot = System.getenv('FUNCHOLE_BUILD_DIR_ROOT')
    if (isolatedBuildRoot) {
        layout.buildDirectory.set(file("${isolatedBuildRoot}/${project.name}"))
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
            mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }

        all {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    jacoco {
        toolVersion = '0.8.13'
    }
}
